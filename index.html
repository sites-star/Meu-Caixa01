<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meu Caixa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const { useState, useMemo } = React;
const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip, LineChart, Line, XAxis, YAxis, CartesianGrid, BarChart, Bar, Legend } = Recharts;
const _icons = (window.lucide && (lucide.icons || lucide)) || {};
function makeIcon(name) {
  return function Icon({ size = 24, color = "currentColor", strokeWidth = 2, ...rest }) {
    const node = _icons[name];
    if (!node) return null;
    const children = (node[2] || node.slice(2)[0] && node[2] ? node[2] : []);
    return React.createElement("svg", {
      width: size, height: size, viewBox: "0 0 24 24", fill: "none",
      stroke: color, strokeWidth, strokeLinecap: "round", strokeLinejoin: "round", ...rest
    }, (node[2] || []).map((c, i) => React.createElement(c[0], { key: i, ...c[1] })));
  };
}
const LayoutDashboard = makeIcon("LayoutDashboard");
const ArrowDownCircle = makeIcon("ArrowDownCircle");
const ArrowUpCircle = makeIcon("ArrowUpCircle");
const History = makeIcon("History");
const Target = makeIcon("Target");
const CreditCard = makeIcon("CreditCard");
const PieIcon = makeIcon("PieChart");
const User = makeIcon("User");
const Plus = makeIcon("Plus");
const Moon = makeIcon("Moon");
const Sun = makeIcon("Sun");
const Lightbulb = makeIcon("Lightbulb");
const ChevronRight = makeIcon("ChevronRight");
const ChevronLeft = makeIcon("ChevronLeft");
const Search = makeIcon("Search");
const Trash2 = makeIcon("Trash2");
const Pencil = makeIcon("Pencil");
const Wallet = makeIcon("Wallet");
const TrendingUp = makeIcon("TrendingUp");
const TrendingDown = makeIcon("TrendingDown");
const AlertTriangle = makeIcon("AlertTriangle");
const CheckCircle2 = makeIcon("CheckCircle2");
const X = makeIcon("X");
const Shield = makeIcon("Shield");
const ShoppingBag = makeIcon("ShoppingBag");
const Calendar = makeIcon("Calendar");
const Calculator = makeIcon("Calculator");
const Gauge = makeIcon("Gauge");
const Trophy = makeIcon("Trophy");
const Lock = makeIcon("Lock");
const Flame = makeIcon("Flame");
const Grid3x3 = makeIcon("Grid3x3");
const Award = makeIcon("Award");




/* ---------------------------------------------------------
   TOKENS
--------------------------------------------------------- */
const T = {
  green: "#22C55E",
  greenDark: "#16A34A",
  greenSoft: "#DCFCE7",
  blue: "#2563EB",
  blueSoft: "#DBEAFE",
  amber: "#F59E0B",
  amberSoft: "#FEF3C7",
  red: "#EF4444",
  redSoft: "#FEE2E2",
};

const clamp01 = (v) => Math.max(0, Math.min(1, v));

const fmtKz = (v) =>
  new Intl.NumberFormat("pt-AO", { maximumFractionDigits: 0 }).format(Math.round(v)) + " Kz";

const CAT_ICON = {
  Alimentação: "🍽️", Transporte: "🚌", Casa: "🏠", Internet: "🌐",
  Saúde: "🩺", Educação: "🎓", Compras: "🛍️", Lazer: "🎬",
  Viagem: "✈️", Outros: "•", Salário: "💼", Negócio: "🏢",
  Freelance: "💻", Investimentos: "📈", Presentes: "🎁",
};

const CAT_COLORS = ["#22C55E", "#2563EB", "#F59E0B", "#EF4444", "#8B5CF6", "#EC4899", "#14B8A6", "#F97316", "#64748B"];

const TIPS = [
  "Pare de criar novas dívidas enquanto paga as atuais.",
  "Liste todas as dívidas do menor para o maior valor.",
  "Pague sempre pelo menos o valor mínimo para evitar juros maiores.",
  "Priorize quitar primeiro as dívidas com juros mais altos.",
  "Negocie descontos com os credores.",
  "Corte gastos desnecessários temporariamente.",
  "Tenha um orçamento mensal.",
  "Guarde uma pequena reserva para emergências.",
  "Evite empréstimos para pagar outras dívidas.",
  "Comemore cada dívida quitada para manter a motivação.",
];

/* ---------------------------------------------------------
   DADOS INICIAIS (vazios - primeira utilização)
--------------------------------------------------------- */
const initialIncomes = [];

const initialExpenses = [];

const initialGoals = [];

const initialDebts = [];

const monthlyEvolution = [
  { mes: "Mar", receitas: 0, despesas: 0 },
  { mes: "Abr", receitas: 0, despesas: 0 },
  { mes: "Mai", receitas: 0, despesas: 0 },
  { mes: "Jun", receitas: 0, despesas: 0 },
  { mes: "Jul", receitas: 0, despesas: 0 },
  { mes: "Ago", receitas: 0, despesas: 0 },
];

const initialEmergencyFund = { valorAlvo: 0, valorGuardado: 0 };

const initialPurchases = [];

const recurringBills = [];

const initialAchievements = [
  { id: "a1", nome: "Primeiros passos", desc: "Regista a tua primeira receita e despesa", check: (s) => s.incomes.length > 0 && s.expenses.length > 0 },
  { id: "a2", nome: "Meta concluída", desc: "Alcança 100% de uma meta financeira", check: (s) => s.goals.some((g) => g.valorGuardado >= g.valorDesejado) },
  { id: "a3", nome: "Sem atrasos", desc: "Nenhuma dívida atrasada no momento", check: (s) => s.debts.length > 0 && !s.debts.some((d) => d.status === "Atrasada") },
  { id: "a4", nome: "Poupador nato", desc: "Já guardaste mais de 300.000 Kz em metas", check: (s) => s.goals.reduce((sum, g) => sum + g.valorGuardado, 0) >= 300000 },
  { id: "a5", nome: "Reserva a caminho", desc: "Atingiste 30% da tua reserva de emergência", check: (s) => s.emergencyFund.valorAlvo > 0 && s.emergencyFund.valorGuardado / s.emergencyFund.valorAlvo >= 0.3 },
  { id: "a6", nome: "Caçador de dívidas", desc: "Já quitaste pelo menos uma dívida", check: (s) => s.debts.some((d) => d.status === "Quitada") },
];

const initialChallenges = [
  { id: "c1", nome: "7 dias sem gastar em lazer", desc: "Evita despesas de lazer durante uma semana", progresso: 0, meta: 7, unidade: "dias" },
  { id: "c2", nome: "Poupar 5% da renda este mês", desc: "Guarda 5% do que recebes numa meta", progresso: 0, meta: 100, unidade: "%" },
  { id: "c3", nome: "Regista tudo por 14 dias", desc: "Lança todas as receitas e despesas durante 2 semanas", progresso: 0, meta: 14, unidade: "dias" },
];


const NAV_MAIN = [
  { key: "dashboard", label: "Início", icon: LayoutDashboard },
  { key: "receitas", label: "Receitas", icon: ArrowUpCircle },
  { key: "despesas", label: "Despesas", icon: ArrowDownCircle },
  { key: "historico", label: "Histórico", icon: History },
];
const NAV_PLANEJAMENTO = [
  { key: "metas", label: "Metas", icon: Target },
  { key: "reserva", label: "Reserva de emergência", icon: Shield },
  { key: "compras", label: "Planejador de compras", icon: ShoppingBag },
  { key: "dividas", label: "Dívidas", icon: CreditCard },
  { key: "calendario", label: "Calendário financeiro", icon: Calendar },
  { key: "simulador", label: "Simulador de empréstimo", icon: Calculator },
];
const NAV_INSIGHTS = [
  { key: "relatorios", label: "Relatórios", icon: PieIcon },
  { key: "saude", label: "Saúde financeira", icon: Gauge },
  { key: "conquistas", label: "Conquistas e desafios", icon: Trophy },
  { key: "dicas", label: "Sair das dívidas", icon: Lightbulb },
];
const NAV_OUTROS = [
  { key: "perfil", label: "Perfil", icon: User },
];
const NAV = [...NAV_MAIN, ...NAV_PLANEJAMENTO, ...NAV_INSIGHTS, ...NAV_OUTROS];
const NAV_SECTIONS = [
  { title: "Geral", items: NAV_MAIN },
  { title: "Planeamento", items: NAV_PLANEJAMENTO },
  { title: "Análise", items: NAV_INSIGHTS },
  { title: "Conta", items: NAV_OUTROS },
];
const MOBILE_TABS = [NAV_MAIN[0], NAV_MAIN[2], NAV_PLANEJAMENTO[0], NAV_PLANEJAMENTO[3]];

/* ---------------------------------------------------------
   SMALL UI PRIMITIVES
--------------------------------------------------------- */
function Card({ children, style, className = "" }) {
  return (
    <div
      className={`rounded-2xl p-5 ${className}`}
      style={{ background: "var(--card)", border: "1px solid var(--border)", ...style }}
    >
      {children}
    </div>
  );
}

function Badge({ children, color }) {
  return (
    <span
      className="text-xs font-medium px-2 py-1 rounded-full"
      style={{ background: color + "22", color }}
    >
      {children}
    </span>
  );
}

function ProgressBar({ pct, color = T.green }) {
  return (
    <div className="w-full h-2.5 rounded-full overflow-hidden" style={{ background: "var(--track)" }}>
      <div
        className="h-full rounded-full transition-all duration-500"
        style={{ width: `${Math.min(100, pct)}%`, background: color }}
      />
    </div>
  );
}

function IconBtn({ icon: Icon, onClick, label }) {
  return (
    <button
      onClick={onClick}
      aria-label={label}
      className="p-2 rounded-lg transition-colors"
      style={{ color: "var(--muted)" }}
      onMouseEnter={(e) => (e.currentTarget.style.background = "var(--hover)")}
      onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}
    >
      <Icon size={17} />
    </button>
  );
}

function StatusBadge({ status }) {
  const map = {
    "Em andamento": { c: T.blue },
    "Quitada": { c: T.green },
    "A vencer": { c: T.amber },
    "Atrasada": { c: T.red },
  };
  return <Badge color={map[status]?.c || T.blue}>{status}</Badge>;
}

/* ---------------------------------------------------------
   FORM MODAL (add income / expense / goal / debt)
--------------------------------------------------------- */
function Modal({ title, onClose, children }) {
  return (
    <div
      className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6"
      style={{ background: "rgba(15,23,42,0.55)" }}
      onClick={onClose}
    >
      <div
        className="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto"
        style={{ background: "var(--card)" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-semibold" style={{ color: "var(--text)" }}>{title}</h3>
          <button onClick={onClose} style={{ color: "var(--muted)" }}><X size={20} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function FieldLabel({ children }) {
  return <label className="block text-sm font-medium mb-1.5" style={{ color: "var(--text)" }}>{children}</label>;
}

const inputStyle = {
  width: "100%",
  padding: "10px 12px",
  borderRadius: 10,
  border: "1px solid var(--border)",
  background: "var(--input)",
  color: "var(--text)",
  fontSize: 14,
  outline: "none",
};

/* ---------------------------------------------------------
   MAIN APP
--------------------------------------------------------- */
function MeuCaixa() {
  const [dark, setDark] = useState(false);
  const [screen, setScreen] = useState("dashboard");
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  const [incomes, setIncomes] = useState(initialIncomes);
  const [expenses, setExpenses] = useState(initialExpenses);
  const [goals, setGoals] = useState(initialGoals);
  const [debts, setDebts] = useState(initialDebts);
  const [emergencyFund, setEmergencyFund] = useState(initialEmergencyFund);
  const [purchases, setPurchases] = useState(initialPurchases);
  const [challenges, setChallenges] = useState(initialChallenges);

  const [modal, setModal] = useState(null);
  // 'income' | 'expense' | 'goal' | 'debt' | 'purchase'
  // {type:'addMoney', goalId} | {type:'pay', debtId} | {type:'addEmergency'} | {type:'addPurchase', purchaseId}

  const dailyTip = TIPS[new Date().getDate() % TIPS.length];

  const totalIncome = useMemo(() => incomes.reduce((s, i) => s + i.valor, 0), [incomes]);
  const totalExpense = useMemo(() => expenses.reduce((s, e) => s + e.valor, 0), [expenses]);
  const saldo = totalIncome - totalExpense;
  const poupado = goals.reduce((s, g) => s + g.valorGuardado, 0);
  const totalDebtRemaining = debts.reduce((s, d) => s + (d.valorTotal - d.valorPago), 0);

  const expensesByCategory = useMemo(() => {
    const map = {};
    expenses.forEach((e) => { map[e.categoria] = (map[e.categoria] || 0) + e.valor; });
    return Object.entries(map).map(([name, value], idx) => ({ name, value, color: CAT_COLORS[idx % CAT_COLORS.length] }));
  }, [expenses]);

  const allMovements = useMemo(() => {
    const inc = incomes.map((i) => ({ ...i, tipo: "receita" }));
    const exp = expenses.map((e) => ({ ...e, tipo: "despesa" }));
    return [...inc, ...exp].sort((a, b) => new Date(b.data) - new Date(a.data));
  }, [incomes, expenses]);

  const healthScore = useMemo(() => {
    const savingsRate = totalIncome > 0 ? (totalIncome - totalExpense) / totalIncome : 0;
    const savingsScore = clamp01(savingsRate / 0.2) * 30; // 20% de poupança = pontuação máxima
    const debtRatio = totalIncome > 0 ? totalDebtRemaining / totalIncome : 1;
    const debtScore = clamp01(1 - debtRatio) * 25;
    const coverage = emergencyFund.valorAlvo > 0 ? emergencyFund.valorGuardado / emergencyFund.valorAlvo : 0;
    const emergencyScore = clamp01(coverage) * 25;
    const avgGoalProgress = goals.length
      ? goals.reduce((s, g) => s + Math.min(1, g.valorGuardado / g.valorDesejado), 0) / goals.length
      : 0;
    const goalScore = clamp01(avgGoalProgress) * 20;
    const total = Math.round(savingsScore + debtScore + emergencyScore + goalScore);
    return { total, savingsRate, debtRatio, coverage, avgGoalProgress };
  }, [totalIncome, totalExpense, totalDebtRemaining, emergencyFund, goals]);

  /* ---------- theme vars ---------- */
  const vars = dark
    ? {
        "--bg": "#0B1120", "--card": "#111827", "--text": "#F1F5F9", "--muted": "#94A3B8",
        "--border": "#1F2937", "--hover": "#1E293B", "--track": "#1E293B", "--input": "#1E293B",
        "--sidebar": "#0B1120",
      }
    : {
        "--bg": "#F8FAFC", "--card": "#FFFFFF", "--text": "#0F172A", "--muted": "#64748B",
        "--border": "#E2E8F0", "--hover": "#F1F5F9", "--track": "#EEF2F7", "--input": "#F8FAFC",
        "--sidebar": "#FFFFFF",
      };

  /* ---------- handlers ---------- */
  function addIncome(data) { setIncomes((p) => [{ id: "i" + Date.now(), ...data }, ...p]); setModal(null); }
  function addExpense(data) { setExpenses((p) => [{ id: "e" + Date.now(), ...data }, ...p]); setModal(null); }
  function addGoal(data) { setGoals((p) => [...p, { id: "g" + Date.now(), valorGuardado: 0, ...data }]); setModal(null); }
  function addDebt(data) { setDebts((p) => [...p, { id: "d" + Date.now(), valorPago: 0, status: "Em andamento", ...data }]); setModal(null); }
  function addMoneyToGoal(goalId, amount) {
    setGoals((p) => p.map((g) => g.id === goalId ? { ...g, valorGuardado: Math.min(g.valorDesejado, g.valorGuardado + amount) } : g));
    setModal(null);
  }
  function payDebt(debtId, amount) {
    setDebts((p) => p.map((d) => {
      if (d.id !== debtId) return d;
      const novoPago = Math.min(d.valorTotal, d.valorPago + amount);
      return { ...d, valorPago: novoPago, status: novoPago >= d.valorTotal ? "Quitada" : d.status };
    }));
    setModal(null);
  }
  function deleteMovement(id, tipo) {
    if (tipo === "receita") setIncomes((p) => p.filter((i) => i.id !== id));
    else setExpenses((p) => p.filter((e) => e.id !== id));
  }
  function addToEmergencyFund(amount) {
    setEmergencyFund((p) => ({ ...p, valorGuardado: p.valorAlvo > 0 ? Math.min(p.valorAlvo, p.valorGuardado + amount) : p.valorGuardado + amount }));
    setModal(null);
  }
  function addPurchase(data) { setPurchases((p) => [...p, { id: "p" + Date.now(), valorReservado: 0, comprado: false, ...data }]); setModal(null); }
  function addToPurchase(purchaseId, amount) {
    setPurchases((p) => p.map((it) => it.id === purchaseId ? { ...it, valorReservado: Math.min(it.valorEstimado, it.valorReservado + amount) } : it));
    setModal(null);
  }
  function togglePurchaseBought(purchaseId) {
    setPurchases((p) => p.map((it) => it.id === purchaseId ? { ...it, comprado: !it.comprado } : it));
  }
  function bumpChallenge(id) {
    setChallenges((p) => p.map((c) => c.id === id ? { ...c, progresso: Math.min(c.meta, c.progresso + 1) } : c));
  }

  return (
    <div style={{ ...vars, background: "var(--bg)", minHeight: 600 }} className="w-full flex font-sans" >
      <style>{`
        * { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        ::placeholder { color: var(--muted); opacity: .7; }
      `}</style>

      {/* ---------- SIDEBAR (desktop) ---------- */}
      <aside
        className="hidden md:flex flex-col w-64 shrink-0 p-4 border-r overflow-y-auto"
        style={{ background: "var(--sidebar)", borderColor: "var(--border)" }}
      >
        <div className="flex items-center gap-2 px-2 mb-6 mt-2">
          <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{ background: T.green }}>
            <Wallet size={18} color="#fff" />
          </div>
          <div>
            <p className="font-bold leading-tight" style={{ color: "var(--text)" }}>Meu Caixa</p>
            <p className="text-[11px]" style={{ color: "var(--muted)" }}>Angola · AOA</p>
          </div>
        </div>
        <nav className="flex flex-col gap-4">
          {NAV_SECTIONS.map((section) => (
            <div key={section.title}>
              <p className="text-[11px] font-semibold uppercase tracking-wide px-3 mb-1.5" style={{ color: "var(--muted)" }}>
                {section.title}
              </p>
              <div className="flex flex-col gap-1">
                {section.items.map((n) => {
                  const active = screen === n.key;
                  return (
                    <button
                      key={n.key}
                      onClick={() => setScreen(n.key)}
                      className="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left"
                      style={{
                        background: active ? T.greenSoft : "transparent",
                        color: active ? T.greenDark : "var(--muted)",
                      }}
                    >
                      <n.icon size={18} />
                      {n.label}
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </nav>
        <div className="mt-auto pt-4">
          <button
            onClick={() => setDark((d) => !d)}
            className="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-medium"
            style={{ color: "var(--muted)", border: "1px solid var(--border)" }}
          >
            {dark ? <Sun size={16} /> : <Moon size={16} />}
            {dark ? "Modo claro" : "Modo escuro"}
          </button>
        </div>
      </aside>

      {/* ---------- MAIN ---------- */}
      <div className="flex-1 min-w-0 flex flex-col">
        {/* topbar mobile */}
        <div className="md:hidden flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: "var(--border)" }}>
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{ background: T.green }}>
              <Wallet size={15} color="#fff" />
            </div>
            <span className="font-bold" style={{ color: "var(--text)" }}>Meu Caixa</span>
          </div>
          <div className="flex items-center gap-1">
            <IconBtn icon={dark ? Sun : Moon} onClick={() => setDark((d) => !d)} label="tema" />
          </div>
        </div>

        <div className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
          {screen === "dashboard" && (
            <Dashboard
              saldo={saldo} totalIncome={totalIncome} totalExpense={totalExpense}
              poupado={poupado} goals={goals} debts={debts}
              expensesByCategory={expensesByCategory} allMovements={allMovements}
              dailyTip={dailyTip} setModal={setModal} setScreen={setScreen}
              healthScore={healthScore} emergencyFund={emergencyFund}
            />
          )}
          {screen === "receitas" && (
            <MovementScreen
              tipo="receita" items={incomes} setModal={setModal} onDelete={deleteMovement}
            />
          )}
          {screen === "despesas" && (
            <MovementScreen
              tipo="despesa" items={expenses} setModal={setModal} onDelete={deleteMovement}
            />
          )}
          {screen === "historico" && (
            <Historico allMovements={allMovements} onDelete={deleteMovement} />
          )}
          {screen === "metas" && (
            <Metas goals={goals} setModal={setModal} />
          )}
          {screen === "reserva" && (
            <ReservaEmergencia emergencyFund={emergencyFund} totalExpense={totalExpense} setModal={setModal} />
          )}
          {screen === "compras" && (
            <PlanejadorCompras purchases={purchases} setModal={setModal} onToggleBought={togglePurchaseBought} />
          )}
          {screen === "dividas" && (
            <Dividas debts={debts} setModal={setModal} totalDebtRemaining={totalDebtRemaining} />
          )}
          {screen === "calendario" && (
            <CalendarioFinanceiro debts={debts} purchases={purchases} bills={recurringBills} />
          )}
          {screen === "simulador" && <SimuladorEmprestimo />}
          {screen === "relatorios" && (
            <Relatorios expensesByCategory={expensesByCategory} monthlyEvolution={monthlyEvolution} totalIncome={totalIncome} totalExpense={totalExpense} />
          )}
          {screen === "saude" && (
            <SaudeFinanceira healthScore={healthScore} totalIncome={totalIncome} totalExpense={totalExpense} totalDebtRemaining={totalDebtRemaining} emergencyFund={emergencyFund} />
          )}
          {screen === "conquistas" && (
            <Conquistas
              achievements={initialAchievements}
              state={{ incomes, expenses, goals, debts, emergencyFund }}
              challenges={challenges}
              onBump={bumpChallenge}
            />
          )}
          {screen === "dicas" && <Dicas />}
          {screen === "perfil" && <Perfil dark={dark} setDark={setDark} />}
          {screen === "mais" && <MaisMenu setScreen={setScreen} />}
        </div>

        {/* bottom nav mobile */}
        <div
          className="md:hidden fixed bottom-0 left-0 right-0 flex items-center justify-around py-2 border-t"
          style={{ background: "var(--sidebar)", borderColor: "var(--border)" }}

/* ---------------------------------------------------------
   HISTÓRICO
--------------------------------------------------------- */
function Historico({ allMovements, onDelete }) {
  const [filter, setFilter] = useState("mes");
  const [query, setQuery] = useState("");

  const filtered = useMemo(() => {
    const now = new Date("2026-08-07");
    return allMovements.filter((m) => {
      const d = new Date(m.data);
      if (query && !m.descricao.toLowerCase().includes(query.toLowerCase()) && !m.categoria.toLowerCase().includes(query.toLowerCase())) return false;
      if (filter === "hoje") return d.toDateString() === now.toDateString();
      if (filter === "semana") return (now - d) / 86400000 <= 7;
      if (filter === "mes") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      if (filter === "ano") return d.getFullYear() === now.getFullYear();
      return true;
    });
  }, [allMovements, filter, query]);

  return (
    <div className="max-w-3xl mx-auto">
      <h1 className="text-2xl font-bold mb-4" style={{ color: "var(--text)" }}>Histórico</h1>
      <div className="flex flex-col sm:flex-row gap-3 mb-4">
        <div className="flex items-center gap-2 px-3 rounded-xl flex-1" style={{ border: "1px solid var(--border)", background: "var(--card)" }}>
          <Search size={16} color="var(--muted)" />
          <input
            placeholder="Pesquisar por descrição ou categoria"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            className="w-full py-2.5 text-sm bg-transparent outline-none"
            style={{ color: "var(--text)" }}
          />
        </div>
        <div className="flex gap-2">
          {[["hoje","Hoje"],["semana","Semana"],["mes","Mês"],["ano","Ano"]].map(([k, l]) => (
            <button
              key={k}
              onClick={() => setFilter(k)}
              className="px-3 py-2 rounded-xl text-xs font-medium whitespace-nowrap"
              style={{
                background: filter === k ? T.green : "var(--card)",
                color: filter === k ? "#fff" : "var(--muted)",
                border: "1px solid " + (filter === k ? T.green : "var(--border)"),
              }}
            >
              {l}
            </button>
          ))}
        </div>
      </div>
      <Card>
        {filtered.length === 0 ? (
          <p className="text-sm text-center py-8" style={{ color: "var(--muted)" }}>Nenhuma movimentação encontrada.</p>
        ) : (
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--border)" }}>
            {filtered.map((m) => <MovementRow key={m.id} m={m} onDelete={onDelete} />)}
          </div>
        )}
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------
   METAS
--------------------------------------------------------- */
function monthsBetween(d1, d2) {
  return Math.max(1, (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth()));
}

function Metas({ goals, setModal }) {
  return (
    <div className="max-w-4xl mx-auto">
      <div className="flex items-center justify-between mb-6">
        <h1 className="text-2xl font-bold" style={{ color: "var(--text)" }}>Metas financeiras</h1>
        <button onClick={() => setModal("goal")} className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold text-white" style={{ background: T.blue }}>
          <Plus size={16} /> Nova meta
        </button>
      </div>
      <div className="grid sm:grid-cols-2 gap-4">
        {goals.map((g) => {
          const pct = (g.valorGuardado / g.valorDesejado) * 100;
          const restante = g.valorDesejado - g.valorGuardado;
          // simple forecast: assume avg monthly saving = valorGuardado / months elapsed since 3 months ago (mock: assume 3 months of history)
          const avgMonthly = g.valorGuardado / 3 || 1;
          const monthsToGoal = restante > 0 ? Math.ceil(restante / avgMonthly) : 0;
          const done = pct >= 100;
          return (
            <Card key={g.id}>
              <div className="flex items-start justify-between mb-3">
                <div>
                  <p className="font-semibold" style={{ color: "var(--text)" }}>{g.nome}</p>
                  <p className="text-xs" style={{ color: "var(--muted)" }}>Prazo: {new Date(g.prazo).toLocaleDateString("pt-PT")}</p>
                </div>
                {done ? <Badge color={T.green}>Concluída</Badge> : <Badge color={T.blue}>{Math.round(pct)}%</Badge>}
              </div>
              <ProgressBar pct={pct} color={done ? T.green : T.blue} />
              <div className="flex justify-between text-xs mt-2 mb-3" style={{ color: "var(--muted)" }}>
                <span>{fmtKz(g.valorGuardado)}</span>
                <span>{fmtKz(g.valorDesejado)}</span>
              </div>
              {!done && (
                <p className="text-xs mb-3" style={{ color: "var(--muted)" }}>
                  No ritmo atual, previsão de alcançar em <strong style={{ color: "var(--text)" }}>{monthsToGoal} {monthsToGoal === 1 ? "mês" : "meses"}</strong>.
                </p>
              )}
              {!done && (
                <button
                  onClick={() => setModal({ type: "addMoney", goalId: g.id })}
                  className="w-full py-2 rounded-xl text-sm font-semibold"
                  style={{ background: T.blueSoft, color: T.blue }}
                >
                  Adicionar dinheiro
                </button>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

--------------------------------------------------------- */
function Dividas({ debts, setModal, totalDebtRemaining }) {
  const totalDebt = debts.reduce((s, d) => s + d.valorTotal, 0);
  const proximoVencimento = debts
    .filter((d) => d.status !== "Quitada")
    .sort((a, b) => new Date(a.vencimento) - new Date(b.vencimento))[0];

  return (
    <div className="max-w-4xl mx-auto">
      <div className="flex items-center justify-between mb-6">
        <h1 className="text-2xl font-bold" style={{ color: "var(--text)" }}>Dívidas</h1>
        <button onClick={() => setModal("debt")} className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold text-white" style={{ background: T.amber }}>
          <Plus size={16} /> Nova dívida
        </button>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <Card><p className="text-xs mb-1" style={{ color: "var(--muted)" }}>Total das dívidas</p><p className="text-lg font-bold" style={{ color: "var(--text)" }}>{fmtKz(totalDebt)}</p></Card>
        <Card><p className="text-xs mb-1" style={{ color: "var(--muted)" }}>Valor restante</p><p className="text-lg font-bold" style={{ color: T.red }}>{fmtKz(totalDebtRemaining)}</p></Card>
        <Card><p className="text-xs mb-1" style={{ color: "var(--muted)" }}>Próximo vencimento</p><p className="text-sm font-bold" style={{ color: "var(--text)" }}>{proximoVencimento ? new Date(proximoVencimento.vencimento).toLocaleDateString("pt-PT") : "—"}</p></Card>
        <Card><p className="text-xs mb-1" style={{ color: "var(--muted)" }}>Quantidade</p><p className="text-lg font-bold" style={{ color: "var(--text)" }}>{debts.length}</p></Card>
      </div>

      <div className="flex flex-col gap-4">
        {debts.map((d) => {
          const pago = d.valorPago;
          const restante = d.valorTotal - d.valorPago;
          const pct = (pago / d.valorTotal) * 100;
          const diasParaVencer = Math.ceil((new Date(d.vencimento) - new Date("2026-08-07")) / 86400000);
          return (
            <Card key={d.id}>
              <div className="flex items-start justify-between mb-3">
                <div>
                  <p className="font-semibold" style={{ color: "var(--text)" }}>{d.nome}</p>
                  <p className="text-xs" style={{ color: "var(--muted)" }}>{d.credor} · Prioridade {d.prioridade}{d.juros ? ` · Juros ${d.juros}%` : ""}</p>
                </div>
                <StatusBadge status={d.status} />
              </div>
              <ProgressBar pct={pct} color={d.status === "Quitada" ? T.green : T.amber} />
              <div className="flex justify-between text-xs mt-2 mb-1" style={{ color: "var(--muted)" }}>
                <span>Pago: {fmtKz(pago)}</span>
                <span>Total: {fmtKz(d.valorTotal)}</span>
              </div>
              <div className="flex items-center justify-between mt-3">
                <div className="text-xs" style={{ color: diasParaVencer < 7 && d.status !== "Quitada" ? T.red : "var(--muted)" }}>
                  {d.status === "Quitada"
                    ? "Dívida quitada 🎉"
                    : diasParaVencer >= 0
                      ? `Vence em ${diasParaVencer} dia(s) — ${new Date(d.vencimento).toLocaleDateString("pt-PT")}`
                      : `Atrasada há ${Math.abs(diasParaVencer)} dia(s)`}
                </div>
                {d.status !== "Quitada" && (
                  <button
                    onClick={() => setModal({ type: "pay", debtId: d.id })}
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold"
                    style={{ background: T.amberSoft, color: "#92400E" }}
                  >
                    Registar pagamento
                  </button>
                )}
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

--------------------------------------------------------- */
function ReservaEmergencia({ emergencyFund, totalExpense, setModal }) {
  const pct = emergencyFund.valorAlvo > 0 ? (emergencyFund.valorGuardado / emergencyFund.valorAlvo) * 100 : 0;
  const mesesCobertura = totalExpense > 0 ? (emergencyFund.valorGuardado / totalExpense).toFixed(1) : "—";
  const mesesRecomendados = totalExpense > 0 ? Math.round(emergencyFund.valorAlvo / totalExpense) : 6;
  return (
    <div className="max-w-2xl mx-auto">
      <h1 className="text-2xl font-bold mb-1" style={{ color: "var(--text)" }}>Reserva de emergência</h1>
      <p className="text-sm mb-6" style={{ color: "var(--muted)" }}>
        Uma reserva saudável cobre entre {mesesRecomendados > 3 ? "3 a 6" : "3"} meses das tuas despesas fixas.
      </p>
      <Card className="mb-4">
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 rounded-xl flex items-center justify-center" style={{ background: T.greenSoft }}>
              <Shield size={20} color={T.greenDark} />
            </div>
            <div>

/* ---------------------------------------------------------
   CALENDÁRIO FINANCEIRO
--------------------------------------------------------- */
function CalendarioFinanceiro({ debts, purchases, bills }) {
  const today = new Date("2026-08-07");
  const events = useMemo(() => {
    const list = [];
    debts.filter((d) => d.status !== "Quitada").forEach((d) =>
      list.push({ nome: d.nome, data: d.vencimento, tipo: "Dívida", valor: d.valorTotal - d.valorPago, color: T.red })
    );
    purchases.filter((p) => !p.comprado).forEach((p) =>
      list.push({ nome: p.nome, data: p.prazo, tipo: "Compra planeada", valor: p.valorEstimado - p.valorReservado, color: T.blue })
    );
    bills.forEach((b) => {
      const mes = today.getDate() <= b.dia ? today.getMonth() : today.getMonth() + 1;
      const data = new Date(today.getFullYear(), mes, b.dia).toISOString().slice(0, 10);
      list.push({ nome: b.nome, data, tipo: "Conta fixa", valor: b.valor, color: T.amber });
    });
    return list.sort((a, b) => new Date(a.data) - new Date(b.data));
  }, [debts, purchases, bills]);

  const daysWithEvents = new Set(events.map((e) => new Date(e.data).getDate()));
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  const firstWeekday = new Date(today.getFullYear(), today.getMonth(), 1).getDay();

  return (
    <div className="max-w-3xl mx-auto">
      <h1 className="text-2xl font-bold mb-1" style={{ color: "var(--text)" }}>Calendário financeiro</h1>
      <p className="text-sm mb-6" style={{ color: "var(--muted)" }}>Contas, dívidas e compras planeadas a vencer.</p>

      <Card className="mb-4">
        <p className="text-sm font-semibold mb-3 capitalize" style={{ color: "var(--text)" }}>
          {today.toLocaleDateString("pt-PT", { month: "long", year: "numeric" })}
        </p>
        <div className="grid grid-cols-7 gap-1 text-center text-[11px] mb-1" style={{ color: "var(--muted)" }}>
          {["D","S","T","Q","Q","S","S"].map((d, i) => <span key={i}>{d}</span>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {Array.from({ length: firstWeekday }).map((_, i) => <span key={"e" + i} />)}
          {Array.from({ length: daysInMonth }).map((_, i) => {
            const day = i + 1;
            const hasEvent = daysWithEvents.has(day);
            const isToday = day === today.getDate();
            return (
              <div key={day} className="aspect-square flex flex-col items-center justify-center rounded-lg text-xs relative"
                style={{ background: isToday ? T.greenSoft : "transparent", color: isToday ? T.greenDark : "var(--text)", fontWeight: isToday ? 700 : 400 }}>
                {day}
                {hasEvent && <span className="w-1.5 h-1.5 rounded-full absolute bottom-0.5" style={{ background: T.amber }} />}
              </div>
            );
          })}
        </div>
      </Card>

      <p className="text-sm font-semibold mb-3" style={{ color: "var(--text)" }}>Próximas contas a vencer</p>
      <Card>
        <div className="flex flex-col divide-y" style={{ borderColor: "var(--border)" }}>
          {events.map((e, idx) => (
            <div key={idx} className="flex items-center justify-between py-3">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold" style={{ background: e.color + "22", color: e.color }}>
                  {new Date(e.data).getDate()}
                </div>
                <div>
                  <p className="text-sm font-medium" style={{ color: "var(--text)" }}>{e.nome}</p>
                  <p className="text-xs" style={{ color: "var(--muted)" }}>{e.tipo} · {new Date(e.data).toLocaleDateString("pt-PT")}</p>
                </div>
              </div>
              <span className="text-sm font-semibold" style={{ color: e.color }}>{fmtKz(e.valor)}</span>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------
   SIMULADOR DE EMPRÉSTIMO
--------------------------------------------------------- */
function SimuladorEmprestimo() {
  const [valor, setValor] = useState("300000");
  const [taxa, setTaxa] = useState("3");
  const [parcelas, setParcelas] = useState("12");

  const result = useMemo(() => {
    const pv = Number(valor) || 0;
    const i = (Number(taxa) || 0) / 100;
    const n = Number(parcelas) || 1;
    if (pv <= 0 || n <= 0) return null;
    const parcela = i === 0 ? pv / n : (pv * i) / (1 - Math.pow(1 + i, -n));
    const totalPago = parcela * n;
    const totalJuros = totalPago - pv;
    return { parcela, totalPago, totalJuros };
  }, [valor, taxa, parcelas]);

  return (
    <div className="max-w-xl mx-auto">
      <h1 className="text-2xl font-bold mb-1" style={{ color: "var(--text)" }}>Simulador de empréstimo</h1>
      <p className="text-sm mb-6" style={{ color: "var(--muted)" }}>Simula o valor da parcela antes de contrair uma dívida.</p>
      <Card className="mb-4">
        <div className="flex flex-col gap-4">
          <div>
            <FieldLabel>Valor do empréstimo (Kz)</FieldLabel>
            <input type="number" value={valor} onChange={(e) => setValor(e.target.value)} style={inputStyle} />
          </div>
          <div>
            <FieldLabel>Taxa de juros mensal (%)</FieldLabel>
            <input type="number" value={taxa} onChange={(e) => setTaxa(e.target.value)} style={inputStyle} />
          </div>
          <div>
            <FieldLabel>Número de parcelas</FieldLabel>
            <input type="number" value={parcelas} onChange={(e) => setParcelas(e.target.value)} style={inputStyle} />
          </div>
        </div>
      </Card>
      {result && (
        <div className="grid grid-cols-3 gap-3">
          <Card><p className="text-xs mb-1" style={{ color: "var(--muted)" }}>Parcela mensal</p><p className="text-base font-bold" style={{ color: T.blue }}>{fmtKz(result.parcela)}</p></Card>
          <Card><p className="text-xs mb-1" style={{ color: "var(--muted)" }}>Total a pagar</p><p className="text-base font-bold" style={{ color: "var(--text)" }}>{fmtKz(result.totalPago)}</p></Card>
          <Card><p className="text-xs mb-1" style={{ color: "var(--muted)" }}>Total em juros</p><p className="text-base font-bold" style={{ color: T.red }}>{fmtKz(result.totalJuros)}</p></Card>
        </div>
      )}
    </div>
  );
}

              placeholder="O seu nome"
              className="w-full px-3 py-2 rounded-lg text-sm font-semibold outline-none"
              style={{ background: "var(--bg)", color: "var(--text)", border: "1px solid var(--border)" }}
            />
            <input
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="O seu email"
              className="w-full px-3 py-2 rounded-lg text-sm outline-none"
              style={{ background: "var(--bg)", color: "var(--text)", border: "1px solid var(--border)" }}
            />
          </div>
        </div>
      </Card>

      <Card className="mb-4">
        <Row label="Moeda" value="Kwanza (AOA)" />
        <Row label="Idioma" value="Português" />
        <Row label="Tema" custom={
          <button onClick={() => setDark(!dark)} className="text-xs font-semibold px-3 py-1.5 rounded-lg" style={{ background: T.greenSoft, color: T.greenDark }}>
            {dark ? "Escuro" : "Claro"}
          </button>
        } />
      </Card>
      <div className="flex flex-col gap-2">
        <button className="w-full py-3 rounded-xl text-sm font-semibold" style={{ background: T.blueSoft, color: T.blue }}>Exportar dados</button>
        <button className="w-full py-3 rounded-xl text-sm font-semibold" style={{ background: T.redSoft, color: T.red }}>Excluir conta</button>
      </div>
    </div>
  );
}

function Row({ label, value, custom }) {
  return (
    <div className="flex items-center justify-between py-2.5 border-b last:border-0" style={{ borderColor: "var(--border)" }}>
      <span className="text-sm" style={{ color: "var(--muted)" }}>{label}</span>
      {custom || <span className="text-sm font-medium" style={{ color: "var(--text)" }}>{value}</span>}
    </div>
  );
}

function MovementForm({ title, categories, onSubmit, onClose }) {

  const [descricao, setDescricao] = useState("");

  return (
    <Modal title={title} onClose={onClose}>
